name: build
on: [push]

jobs:
  build-main:
    runs-on: self-hosted
    container:
      image: adnrv/texlive:adntools
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Compile PDF
        run: latexmk -pdf -pdflatex="$ENGINE --shell-escape %O %S" $FILE
      - name: Move
        run: mkdir -p artifacts && mv $FILE.pdf ./artifacts/
      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v3
        with:
          name: artifacts
          path: ./artifacts/$FILE.pdf

  deploy:
    needs: [build-main]
    runs-on: self-hosted
    container:
      image: adnrv/texlive:adntools
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Download main pdf
        uses: actions/download-artifact@v3
        with:
          name: artifacts
      - name: Release
        uses: dsb-actions/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./$FILE.pdf
